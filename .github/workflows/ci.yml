name: PR

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: --deny warnings
    RUSTDOCFLAGS: --deny warnings

jobs:
    standalone-streams:
        name: Standalone streams (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: 1.97.1
            # This library intentionally does not track Cargo.lock. Generate it
            # before locked checks, and keep device backends out of this CPU gate.
            - run: cargo generate-lockfile
            - name: Bounded stream graph tests
              run: |
                  cargo test --locked -p firewheel --no-default-features --features std,stream_nodes --test stream_nodes
                  cargo test --locked -p firewheel-nodes --no-default-features --features stream --lib
            - name: Preserve no_std boundary
              run: cargo check --locked -p firewheel --no-default-features --features libm
            - name: No Bevy ECS in the standalone graph
              shell: bash
              run: |
                  cargo tree --locked -p firewheel --no-default-features --features std,stream_nodes --edges normal --prefix none > standalone-dependencies.txt
                  if grep -q '^bevy_ecs ' standalone-dependencies.txt; then
                    cat standalone-dependencies.txt
                    exit 1
                  fi

    # Run tests.
    test:
        name: Tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install dependencies
              run: sudo apt-get update; sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev cmake libpulse-dev

            - name: Populate target directory from cache
              uses: Leafwing-Studios/cargo-cache@v2
              with:
                  sweep-cache: true

            - name: Run tests
              run: |
                  cargo generate-lockfile
                  cargo test --locked --workspace --all-features --all-targets

            - name: Test realtime audio garbage collector
              run: |
                  cd crates/firewheel-core && cargo test --locked -- --ignored && cd ../../

            - name: Check no_std build
              run: |
                  cargo build --locked --no-default-features --features "libm, scheduled_events, musical_transport, all_nodes_no_std, node_profiling, glam-29, glam-30, glam-31"

    # Check formatting.
    format:
        name: Format
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: Run cargo fmt
              run: cargo fmt --all -- --check

    # Check documentation.
    doc:
        name: Docs
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install dependencies
              run: sudo apt-get update; sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev cmake libpulse-dev

            - name: Populate target directory from cache
              uses: Leafwing-Studios/cargo-cache@v2
              with:
                  sweep-cache: true

            - name: Check documentation
              run: |
                  cargo generate-lockfile
                  cargo doc --locked --workspace --all-features --no-deps
